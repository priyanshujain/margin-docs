<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<!-- Margin Docs mark: stacked text bars, a paragraph seen as an alignment glyph. Source of truth
     for every file in this directory; regenerate them with `pnpm tauri icon` after editing.
     Squircle 828 wide on a 1024 canvas is the macOS icon inset, and every coordinate is a multiple
     of 32 so bars and gaps land on whole pixels at 32x32. The block spans y 224..768 against a
     centre of 512, which lifts it 16 above the geometric centre for optical balance. -->
<rect x="98" y="98" width="828" height="828" rx="185" fill="#0d0c0a"/>
<g fill="#fcfbf7">
<rect x="224" y="224" width="576" height="64" rx="32"/>
<rect x="224" y="384" width="416" height="64" rx="32"/>
<rect x="224" y="544" width="576" height="64" rx="32"/>
<rect x="224" y="704" width="288" height="64" rx="32"/>
</g>
</svg>
