name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # macOS, not Linux. The keymap layer resolves the primary modifier from the user agent, so on a
    # Linux runner `fits.test.ts` enumerates Ctrl chords and compares them against the Command ones
    # the app actually binds. The app is macOS only; CI runs where it ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      # `pnpm build` is tsc then vite, so this is the typecheck and the bundle in one step.
      - run: pnpm build

      - run: pnpm test

  rust:
    # Same reason, more sharply: `trash_does_not_hard_delete` asserts the file lands in
    # `$HOME/.Trash`, which is where macOS puts it and not where Linux does.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # tauri_build::build() wants a frontendDist that exists. The example file is what a fresh
      # clone compiles against, so that is what CI uses.
      - name: Stub the build inputs
        run: mkdir -p dist && touch dist/index.html

      # Every target except `no_write_on_open`, which is skipped rather than run and failing.
      # That suite checks the promise the whole project rests on, that the editor writes nothing
      # the user did not edit, and it checks it against a real git repository rather than a
      # TempDir. The repository is hand built at a hardcoded path under /tmp, so there is nothing
      # here to create it and macOS reaps it after three days without access. It is not skipped
      # because it is unimportant. It is skipped because it currently cannot run anywhere, and a
      # CI that is permanently red says less than one that is green about a named subset.
      # Making the fixture reproducible is tracked in the issue.
      - name: Test
        working-directory: src-tauri
        run: cargo test --lib --bins --test fs --test fts5 --test watch --test watch_payload
